    <!-- Section tabs, built from each .fun-block's heading by js/photos.js. Desktop: this rail in the
         left margin (outside the section: its entrance transform would pin a fixed element to the section).
         Phone/tablet: the .fun-tabbar row inside the section instead. -->
    <div class="fun-toc">
        <p class="fun-intro">My free time interests</p>
        <div class="fun-toc-tabs" id="fun-toc" role="tablist" aria-label="Fun sections" aria-orientation="vertical"></div>
    </div>

    <!-----------------------PHOTOS SECTION--------------------->
    <section id="photos">
        <p class="fun-intro fun-intro-inline">My free time interests</p>

        <div class="fun-tabbar" id="fun-tabbar" role="tablist" aria-label="Fun sections"></div>

        <div class="fun-block" id="fun-photos" data-tab="photos">
            <h2 class="fun-heading">Photos</h2>

            <div class="photos-toolbar">
                <div class="photos-tabs" role="tablist" aria-label="Photo categories">
                    <button class="photos-tab" role="tab" data-category="all">All<span class="photos-tab-count"></span></button>
                    <button class="photos-tab" role="tab" data-category="street">Street<span class="photos-tab-count"></span></button>
                    <button class="photos-tab" role="tab" data-category="landscape">Landscape<span class="photos-tab-count"></span></button>
                </div>
                <div class="photos-toolbar-right">
                    <div class="strip-controls">
                        <span class="strip-counter" id="photo-strip-counter"></span>
                        <button class="strip-btn" id="photo-strip-prev" aria-label="Previous photos"><i class="fas fa-arrow-left"></i></button>
                        <button class="strip-btn" id="photo-strip-next" aria-label="Next photos"><i class="fas fa-arrow-right"></i></button>
                    </div>
                    <div class="photos-view-toggle" aria-label="Layout">
                        <button class="photos-view-btn" data-view="strip" aria-label="Horizontal strip" title="Strip"><i class="fas fa-grip-lines-vertical"></i></button>
                        <button class="photos-view-btn" data-view="grid" aria-label="Grid" title="Grid"><i class="fas fa-th-large"></i></button>
                    </div>
                </div>
            </div>

            <!-- Filled from images/photos/photos.json (run scripts/build_photos.py) -->
            <div class="photos-display view-strip" id="photos-display"></div>

            <p class="photos-empty" id="photos-empty" hidden>Photos coming soon.</p>

            <a href="https://www.flickr.com/photos/201227251@N04/" target="_blank" class="photos-flickr-link">
                More on Flickr <i class="fas fa-arrow-right"></i>
            </a>
        </div>

        <!-- Filled from music.json (run api/update_spotify.py) -->
        <div class="fun-block music-section" id="fun-on-rotation" data-tab="on-rotation">
            <h2 class="fun-heading">On Rotation</h2>
            <h3 class="music-row-title">Top Artists</h3>
            <div class="music-row" id="music-artists"></div>
            <h3 class="music-row-title">Top Songs</h3>
            <div class="music-row" id="music-tracks"></div>
            <a href="https://open.spotify.com/user/1hukv58wvbhdkoyekj09zsitf?si=51c63352fd8d4055" target="_blank" class="photos-flickr-link">
                More on Spotify <i class="fas fa-arrow-right"></i>
            </a>
        </div>

        <!-- Listening stats: numbers come from music.json (api/update_spotify.py), charts drawn by js/music-stats.js -->
        <div class="fun-block stats-section" id="fun-listening-stats" data-tab="listening-stats">
            <h2 class="fun-heading">Listening Stats</h2>
            <p class="stats-note" id="stats-note"></p>

            <div class="stat-tiles" id="stat-tiles"></div>

            <div class="stats-grid">
                <figure class="chart-card chart-wide">
                    <figcaption>
                        <h3 class="chart-title">Underground or mainstream?</h3>
                        <p class="chart-sub">Each dot is one of my top artists, placed by Spotify's popularity score (0&ndash;100)</p>
                    </figcaption>
                    <div class="chart-body" id="chart-popularity"></div>
                    <details class="chart-data"><summary>Show data</summary><div id="table-popularity"></div></details>
                </figure>

                <figure class="chart-card">
                    <figcaption>
                        <h3 class="chart-title">Top genres</h3>
                        <p class="chart-sub" id="genres-sub"></p>
                    </figcaption>
                    <div class="chart-body" id="chart-genres"></div>
                    <details class="chart-data"><summary>Show data</summary><div id="table-genres"></div></details>
                </figure>

                <figure class="chart-card">
                    <figcaption>
                        <h3 class="chart-title">When my music came out</h3>
                        <p class="chart-sub" id="years-sub"></p>
                    </figcaption>
                    <div class="chart-body" id="chart-years"></div>
                    <details class="chart-data"><summary>Show data</summary><div id="table-years"></div></details>
                </figure>

                <figure class="chart-card chart-wide">
                    <figcaption>
                        <h3 class="chart-title">Climbing and fading</h3>
                        <p class="chart-sub">My top artists this month compared with the past year</p>
                    </figcaption>
                    <div class="chart-body movers" id="chart-movers"></div>
                </figure>
            </div>
        </div>
    </section>

        <figure class="photo-modal-figure">
            <img id="photoModalImage" src="" alt="">
            <figcaption id="photoModalCaption"></figcaption>
        </figure>
        <button class="photo-modal-nav photo-modal-next" onclick="stepPhoto(1)" aria-label="Next photo"><i class="fas fa-chevron-right"></i></button>
    </div>
